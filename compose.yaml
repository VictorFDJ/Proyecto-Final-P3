name: mi-presupuesto

services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Copia docker.env.example como .env y configura DB_PASSWORD}
      MSSQL_MEMORY_LIMIT_MB: 2048
    ports:
      - "14330:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: API-MiPresupuesto/API-MiPresupuesto/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Server=database,1433;Database=MiPresupuestoDb;User Id=sa;Password=${DB_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY:?Configura JWT_KEY en el archivo .env con al menos 32 caracteres}
      Jwt__Issuer: MiPresupuesto.Api
      Jwt__Audience: MiPresupuesto.Client
      Jwt__ExpirationMinutes: 120
      AllowedOrigins__0: http://localhost:8081
      AllowedOrigins__1: http://127.0.0.1:8081
      Database__MigrateOnStartup: "true"
      Swagger__Enabled: "true"
      HttpsRedirection__Enabled: "false"
      PasswordReset__ExposeToken: "true"
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
        restart: true
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Frontend-MiPresupuesto/Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      - "8081:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  sqlserver_data:
